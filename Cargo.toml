# Top-level Cargo workspace.
#
# Tauri builds from `src-tauri`, but cargo walks upward and finds this root,
# so the Tauri app and the protocol crate share one lockfile / target dir.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/walkplay-dac-protocol"]

# Size-first release build: a smaller executable loads faster and the app's own
# code is nowhere near CPU-bound.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
